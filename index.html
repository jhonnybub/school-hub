<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ט׳3">
  <meta name="description" content="מרכז המידע של כיתה ט׳3 — מערכת שעות, מבחנים ועלון שבועי">
  <title>מרכז המידע של ט׳3</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <style>
    @font-face {
      font-family: "Assistant";
      src: url("fonts/Assistant-VariableFont_wght.ttf") format("truetype");
      font-weight: 100 800;
      font-style: normal;
      font-display: block;
    }

    :root {
      --black: #000000;
      --white: #FFFFFF;
      --red: #E10600;
      --muted: #6B6B6B;
      --cancelled: #9A9A9A;
      --line: #EEEEEE;
      --font: "Assistant", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      background: var(--white);
      color: var(--black);
      font-family: var(--font);
      font-weight: 400;
      font-size: 17px;
      line-height: 1.25;
      min-height: 100%;
      direction: rtl;
      text-align: right;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    body {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    .app {
      max-width: 430px;
      margin: 0 auto;
      padding: 16px 24px 40px;
      min-height: 100dvh;
    }

    header.app-header { margin-bottom: 20px; }

    .greeting {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.4px;
      line-height: 1.15;
      color: var(--black);
    }

    .date {
      margin-top: 6px;
      font-size: 15px;
      font-weight: 400;
      color: var(--muted);
      letter-spacing: -0.1px;
      line-height: 1.3;
    }

    .example-banner {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 400;
      line-height: 1.3;
    }

    .text-nav {
      display: none;
      gap: 16px;
      margin: -8px 0 20px;
      padding: 0 0 12px;
      border-bottom: 1px solid var(--line);
    }
    .text-nav.visible { display: flex; }
    .text-nav button {
      appearance: none;
      border: 0;
      background: none;
      padding: 8px 0;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      line-height: 1.3;
    }
    .text-nav button[aria-selected="true"] { color: var(--black); }

    .screen { display: none; }
    .screen.active { display: block; }

    .section { margin-top: 0; }
    .section + .section { margin-top: 24px; }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--black);
      margin-bottom: 6px;
      line-height: 1.3;
    }

    button.section-link {
      appearance: none;
      border: 0;
      background: none;
      padding: 0;
      font: inherit;
      color: inherit;
      cursor: pointer;
    }

    .row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid var(--line);
    }
    .row:last-child { border-bottom: 0; }

    .row-start { min-width: 0; flex: 1; }

    .row-top {
      display: flex;
      align-items: baseline;
      gap: 8px;
      min-width: 0;
    }

    .subject {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.2px;
      line-height: 1.25;
      color: var(--black);
    }

    .room {
      font-size: 13px;
      font-weight: 400;
      color: var(--muted);
      line-height: 1.3;
      margin-top: 2px;
    }

    .time {
      font-size: 15px;
      font-weight: 400;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      direction: ltr;
      unicode-bidi: isolate;
      flex-shrink: 0;
      line-height: 1.25;
      letter-spacing: -0.1px;
    }

    .done-mark {
      font-size: 13px;
      font-weight: 400;
      color: var(--muted);
      line-height: 1.25;
      flex-shrink: 0;
    }

    .flag {
      font-size: 13px;
      font-weight: 600;
      color: var(--red);
      line-height: 1.25;
      flex-shrink: 0;
    }

    .row.cancelled .subject {
      color: var(--muted);
      text-decoration: line-through;
      text-decoration-thickness: 1px;
      text-decoration-color: #9A9A9A;
    }
    .row.cancelled .room,
    .row.cancelled .time {
      color: var(--cancelled);
    }

    .count {
      font-size: 14px;
      font-weight: 400;
      color: var(--muted);
      flex-shrink: 0;
      line-height: 1.25;
      white-space: nowrap;
    }
    .count.urgent {
      color: var(--red);
      font-weight: 600;
    }

    .type-tag {
      font-size: 12px;
      font-weight: 400;
      color: var(--muted);
      line-height: 1.2;
      flex-shrink: 0;
      padding: 1px 6px;
      border: 1px solid #EEEEEE;
      border-radius: 4px;
      background: #F4F4F4;
    }

    .empty, .info, .install-hint, .more-link, .intro, .newsletter-body {
      font-size: 15px;
      font-weight: 400;
      color: var(--muted);
      line-height: 1.45;
    }
    .install-hint { margin-top: 24px; }
    .more-link {
      display: inline-block;
      margin-top: 16px;
      color: var(--black);
      font-weight: 600;
      font-size: 13px;
      text-decoration: none;
      background: none;
      border: 0;
      padding: 0;
      font-family: inherit;
      cursor: pointer;
    }
    .newsletter-title {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.2px;
      line-height: 1.25;
      color: var(--black);
      margin-bottom: 4px;
    }
    .newsletter-date {
      font-size: 13px;
      font-weight: 400;
      color: var(--muted);
      margin-bottom: 16px;
    }
    .intro {
      color: var(--black);
      margin-bottom: 20px;
    }
    .newsletter-body {
      color: var(--black);
      white-space: pre-wrap;
      margin: 0;
    }

    .day-over {
      font-size: 40px;
      font-weight: 700;
      color: var(--black);
      line-height: 1.1;
      letter-spacing: -0.5px;
      margin: 4px 0 8px;
    }
    .row.over .subject,
    .row.over .room,
    .row.over .time,
    .row.over .done-mark,
    .row.over .flag {
      color: var(--cancelled);
    }

    .push-area { margin-top: 24px; }
    .push-area[hidden] { display: none; }
    .push-link {
      appearance: none;
      border: 0;
      background: none;
      padding: 0;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      color: var(--black);
      cursor: pointer;
    }
    .push-note {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.45;
      margin-top: 8px;
    }
    .push-code {
      display: block;
      width: 100%;
      margin-top: 8px;
      min-height: 96px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 4px;
      font-family: ui-monospace, Menlo, monospace;
      font-size: 11px;
      color: var(--black);
      background: #FAFAFA;
      direction: ltr;
      text-align: left;
      resize: vertical;
    }
    .push-copy {
      appearance: none;
      margin-top: 8px;
      padding: 6px 14px;
      border: 1px solid var(--black);
      border-radius: 4px;
      background: var(--white);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      color: var(--black);
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1 class="greeting" id="greeting"></h1>
      <p class="date" id="date-line"></p>
      <p class="example-banner" id="example-banner" hidden>מוצגים נתוני דוגמה — יוחלפו כש-Daft יעביר את המידע האמיתי.</p>
    </header>

    <nav class="text-nav" id="text-nav" aria-label="מסכים">
      <button type="button" data-target="home">ראשי</button>
      <button type="button" data-target="schedule">מערכת</button>
      <button type="button" data-target="exams">מבחנים</button>
      <button type="button" data-target="newsletter">עלון</button>
    </nav>

    <main>
      <section class="screen active" id="screen-home" data-screen="home"></section>
      <section class="screen" id="screen-schedule" data-screen="schedule"></section>
      <section class="screen" id="screen-exams" data-screen="exams"></section>
      <section class="screen" id="screen-newsletter" data-screen="newsletter"></section>
    </main>

    <div class="push-area" id="push-area" hidden>
      <button type="button" class="push-link" id="push-link">הפעל התראות</button>
      <div id="push-panel"></div>
    </div>
  </div>

  <script>
  // ---------------------------------------------------------------------------
  // TODO: Daft data plugs in here
  // Live data lives in data/schedule.json, data/exams.json and
  // data/newsletter.json. loadData() tries those files first via fetch, then
  // falls back to this block (same real data). Do not scrape or fetch remote
  // school sources from this app.
  //
  // schedule: {date, class, lessons:[{num, start, end, subject, teacher, room,
  //   status}]}. start/end/status may be null. When start/end are null, times
  //   are filled from the built-in bell schedule (BELL_SCHEDULE) by lesson num
  //   (1-based period). A list of days, or {is_example, class, days:[...]},
  //   is also accepted.
  // exams: [{eventDate, type: EXAM|QUIZ|EVENT|VACATION, title, typeLabel?}]
  //   or {is_example, events:[...]}.
  // newsletter: {title, date, intro, sections:[{heading, body}]}.
  // ---------------------------------------------------------------------------
  const EMBEDDED_DATA = {
  "schedule": [
    {
      "date": "2026-11-24",
      "class": "ט׳3",
      "lessons": [
        {
          "num": 1,
          "start": null,
          "end": null,
          "subject": "היסטוריה",
          "teacher": "לין",

          "status": null
        },
        {
          "num": 2,
          "start": null,
          "end": null,
          "subject": "חינוך גופני/ספרדית",
          "teacher": "בתיה/אינה",
          "room": null,
          "status": null
        },
        {
          "num": 3,
          "start": null,
          "end": null,
          "subject": "ביולוגיה",
          "teacher": "רונית",
          "room": "ט׳3",
          "status": null
        },
        {
          "num": 4,
          "start": null,
          "end": null,
          "subject": "מתמטיקה",
          "teacher": "קרן/חגית",
          "room": null,

        },
        {

          "subject": "מתמטיקה",
          "teacher": "קרן/חגית",
          "room": null,
          "status": null
        }
      ]
    }
  ],
  "exams": [
        {
      "eventDate": "2026-11-26",
      "type": "EVENT",
      "title": "רב תרבותי- סיור בפלמחים",
      "typeLabel": "אירוע"
    },
        {
      "eventDate": "2026-12-01",
      "type": "EXAM",
      "title": "ביולגיה",
      "typeLabel": "מבחן"
    },
        {

    },

    },

        {

        {

    },
        {

      "title": "רב תרבותי- סיור לרמלה",
      "typeLabel": "אירוע"
    },
        {
      "eventDate": "2027-01-05",
      "type": "EXAM",

    },
        {
      "eventDate": "2027-03-17",
      "type": "EVENT",
      "title": "טיול מסלול רב תרבותי",
      "typeLabel": "אירוע"
    },
        {
      "eventDate": "2027-03-18",
      "type": "EVENT",
      "title": "טיול מסלול רב תרבותי",
      "typeLabel": "אירוע"
    }
  ],
  "newsletter": {
    "title": "העלון השבועי של ט׳3"
  }
};

  const TZ = "Asia/Jerusalem";
  const WEEKDAYS = ["ראשון", "שני", "שלישי", "רביעי", "חמישי", "שישי", "שבת"];
  const HE_MONTHS = ["בינואר", "בפברואר", "במרץ", "באפריל", "במאי", "ביוני", "ביולי", "באוגוסט", "בספטמבר", "באוקטובר", "בנובמבר", "בדצמבר"];
  const TYPE_LABELS = { EXAM: "מבחן", QUIZ: "בוחן", EVENT: "אירוע", VACATION: "חופשה" };
  const EXAM_TYPES = new Set(["EXAM", "QUIZ"]);
  const SCREENS = ["home", "schedule", "exams", "newsletter"];
  const CLASS_NAME = "ט׳3";

  // Built-in bell schedule. Daft's data often has start/end = null; we fill
  // from here by 1-based period number (schedule.json "num").
  const BELL_SCHEDULE = {
    1: { start: "08:30", end: "09:15" },
    2: { start: "09:15", end: "10:05" },
    3: { start: "10:20", end: "11:05" },
    4: { start: "11:05", end: "11:50" },
    5: { start: "12:10", end: "12:55" },
    6: { start: "12:55", end: "13:40" },
    7: { start: "13:55", end: "14:40" },
    8: { start: "14:40", end: "15:25" },
    9: { start: "15:30", end: "16:15" },
  };

  const state = { today: null, schedule: null, exams: null, newsletter: null, isExample: false, picked: null, className: CLASS_NAME };

  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function todayIsrael() {
    const parts = new Intl.DateTimeFormat("en-CA", {
      timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit",
    }).format(new Date());
    return parts; // YYYY-MM-DD
  }

  function currentHourIsrael() {
    return Number(new Intl.DateTimeFormat("en-GB", {
      timeZone: TZ, hour: "2-digit", hourCycle: "h23",
    }).format(new Date()));
  }

  function greetingNow() {
    const hour = currentHourIsrael();
    let word;
    if (hour >= 5 && hour < 12) word = "בוקר טוב";
    else if (hour >= 12 && hour < 17) word = "צהריים טובים";
    else if (hour >= 17 && hour < 22) word = "ערב טוב";
    else word = "לילה טוב";
    return `${word}, ג׳וני`;
  }

  function parseISODate(value) {
    if (!value || typeof value !== "string") return null;
    const m = value.trim().match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (!m) return null;
    return { iso: `${m[1]}-${m[2]}-${m[3]}`, y: +m[1], mo: +m[2], d: +m[3] };
  }

  function addDays(iso, n) {
    const [y, mo, d] = iso.split("-").map(Number);
    const dt = new Date(Date.UTC(y, mo - 1, d + n));
    const yy = dt.getUTCFullYear();
    const mm = String(dt.getUTCMonth() + 1).padStart(2, "0");
    const dd = String(dt.getUTCDate()).padStart(2, "0");
    return `${yy}-${mm}-${dd}`;
  }

  function weekdayName(iso) {
    const [y, mo, d] = iso.split("-").map(Number);
    return WEEKDAYS[new Date(Date.UTC(y, mo - 1, d)).getUTCDay()];
  }

  function formatLongDate(iso) {
    const p = parseISODate(iso);
    if (!p) return "";
    return `יום ${weekdayName(iso)} ${p.d} ${HE_MONTHS[p.mo - 1]}`;
  }

  function formatExamDate(iso) {
    const p = parseISODate(iso);
    if (!p) return "";
    return `יום ${weekdayName(iso)}, ${p.d} ${HE_MONTHS[p.mo - 1]}`;
  }

  function formatClass(name) {
    const raw = String(name || CLASS_NAME).trim() || CLASS_NAME;
    return raw.replace(/'/g, "׳").replace(/"/g, "״");
  }

  function headerDateLine(iso, today, className) {
    if (!iso) return `${formatLongDate(today)} · ${formatClass(className)}`;
    const rel = iso === addDays(today, 1) ? "מחר, " : (iso === today ? "היום, " : "");
    return `${rel}${formatLongDate(iso)} · ${formatClass(className)}`;
  }

  function daysUntil(iso, today) {
    const a = parseISODate(iso), b = parseISODate(today);
    if (!a || !b) return 0;
    return Math.round(Date.UTC(a.y, a.mo - 1, a.d) - Date.UTC(b.y, b.mo - 1, b.d)) / 86400000;
  }

  function daysUntilLabel(iso, today) {
    const delta = daysUntil(iso, today);
    if (delta === 0) return [delta, "היום"];
    if (delta === 1) return [delta, "מחר"];
    if (delta === -1) return [delta, "אתמול"];
    if (delta > 1) return [delta, `בעוד ${delta} ימים`];
    return [delta, `לפני ${Math.abs(delta)} ימים`];
  }

  function isUrgentCountdown(iso, today, type) {
    if (!iso || !EXAM_TYPES.has(type)) return false;
    const delta = daysUntil(iso, today);
    return delta >= 0 && delta < 3;
  }

  function bellFor(num) {
    const n = Number(num);
    if (!Number.isInteger(n) || n < 1) return null;
    return BELL_SCHEDULE[n] || null;
  }

  function fillLessonTimes(lesson, index) {
    if (!lesson || typeof lesson !== "object") return lesson;
    const num = lesson.num != null && lesson.num !== "" ? lesson.num : (index + 1);
    const bells = bellFor(num);
    const start = timeText(lesson.start) || (bells && bells.start) || "";
    const end = timeText(lesson.end) || (bells && bells.end) || "";
    return { ...lesson, num, start: start || null, end: end || null };
  }

  function fillDayTimes(day) {
    if (!day || typeof day !== "object") return day;
    const lessons = Array.isArray(day.lessons) ? day.lessons.map(fillLessonTimes) : day.lessons;
    return { ...day, lessons };
  }

  function normalizeSchedule(raw) {
    if (!raw) return null;
    let result = null;
    if (Array.isArray(raw)) {
      result = { is_example: false, class: raw[0] && raw[0].class, days: raw };
    } else if (Array.isArray(raw.days)) {
      result = { is_example: !!raw.is_example, class: raw.class || raw.class_name, days: raw.days };
    } else if (raw.lessons || raw.date) {
      result = { is_example: !!raw.is_example, class: raw.class || raw.class_name, days: [raw] };
    }
    if (!result) return null;
    result.days = (result.days || []).map(fillDayTimes);
    return result;
  }

  function normalizeExams(raw) {
    if (!raw) return null;
    if (Array.isArray(raw)) return { is_example: false, events: raw };
    const events = raw.events || raw.exams;
    if (!Array.isArray(events)) return null;
    return { is_example: !!raw.is_example, events };
  }

  function normalizeNewsletter(raw) {
    if (!raw || typeof raw !== "object" || Array.isArray(raw)) return null;
    if (!raw.title && !raw.intro && !raw.sections) return null;
    return raw;
  }

  async function loadFromFiles() {
    const [s, e, n] = await Promise.all([
      fetch("data/schedule.json", { cache: "no-cache" }),
      fetch("data/exams.json", { cache: "no-cache" }),
      fetch("data/newsletter.json", { cache: "no-cache" }),
    ]);
    if (!s.ok || !e.ok || !n.ok) throw new Error("data files unavailable");
    return {
      schedule: await s.json(),
      exams: await e.json(),
      newsletter: await n.json(),
    };
  }

  async function loadData() {
    // Try local data/*.json first (Daft drop-in). Fall back to the embedded copy of the same data.
    try {
      return await loadFromFiles();
    } catch {
      return EMBEDDED_DATA;
    }
  }

  function timeText(value) {
    if (value == null || value === false) return "";
    const text = String(value).trim();
    if (!text || /^(null|undefined|none|n\/a)$/i.test(text)) return "";
    return text;
  }

  function lessonStart(lesson) {
    const start = timeText(lesson && lesson.start);
    if (start) return start;
    const time = timeText(lesson && lesson.time);
    if (time) return time.split(/[–-]/)[0].trim();
    return timeText(lesson && lesson.end);
  }

  function formatLessonTime(lesson) {
    const start = timeText(lesson && lesson.start) || lessonStart(lesson);
    const end = timeText(lesson && lesson.end);
    if (start && end) return `${start}–${end}`;
    return start || end || "";
  }

  function parseTimeMinutes(value) {
    const text = timeText(value);
    if (!text) return null;
    const m = text.match(/^(\d{1,2}):(\d{2})(?::\d{2})?$/);
    if (!m) return null;
    const h = Number(m[1]), min = Number(m[2]);
    if (h > 23 || min > 59) return null;
    return h * 60 + min;
  }

  function nowIsrael() {
    const parts = new Intl.DateTimeFormat("en-GB", {
      timeZone: TZ,
      year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", hourCycle: "h23",
    }).formatToParts(new Date());
    const get = (type) => parts.find((p) => p.type === type).value;
    const hour = Number(get("hour"));
    const minute = Number(get("minute"));
    return {
      date: `${get("year")}-${get("month")}-${get("day")}`,
      hour,
      minute,
      minutes: hour * 60 + minute,
    };
  }

  function isLessonDone(lesson, dayIso) {
    if (!dayIso || dayIso !== todayIsrael()) return false;
    if (lessonFlag(lesson) === "בוטל") return false;
    const end = parseTimeMinutes(lesson && lesson.end);
    if (end == null) return false;
    return nowIsrael().minutes >= end;
  }

  // Day over: today's last non-cancelled lesson has ended (Asia/Jerusalem).
  function isDayOver(day, dayIso) {
    if (!day || !dayIso || dayIso !== todayIsrael()) return false;
    const ends = (day.lessons || [])
      .map((lesson, i) => fillLessonTimes(lesson, Number(lesson && lesson.num) ? Number(lesson.num) - 1 : i))
      .filter((lesson) => lessonFlag(lesson) !== "בוטל")
      .map((lesson) => parseTimeMinutes(lesson.end))
      .filter((m) => m != null);
    if (!ends.length) return false;
    return nowIsrael().minutes >= Math.max(...ends);
  }

  const DAY_OVER_HTML = `<p class="day-over">נגמר!</p>`;

  function formatRoom(room) {
    const r = String(room || "").trim();
    if (!r) return "";
    if (/^חדר\b/.test(r)) return r;
    if (/^\d+$/.test(r)) return `חדר ${r}`;
    return r;
  }

  function lessonFlag(lesson) {
    if (!lesson || typeof lesson !== "object") return "";
    const truthy = (v) => v === true || v === 1 || v === "1" || String(v).toLowerCase() === "true";
    const raw = lesson.status || lesson.flag || lesson.state || lesson.change_type || "";
    const text = String(raw).trim();
    const lower = text.toLowerCase();
    const cancelledWords = ["cancelled", "canceled", "cancel", "בוטל"];
    if (
      truthy(lesson.cancelled) || truthy(lesson.canceled) ||
      cancelledWords.includes(lower) || text === "בוטל"
    ) return "בוטל";
    if (
      truthy(lesson.changed) || truthy(lesson.substituted) ||
      lower === "changed" || lower === "change" ||
      lower === "substituted" || lower === "substitution" ||
      text === "שינוי"
    ) return "שינוי";
    if (typeof lesson.change === "boolean" && lesson.change) return "שינוי";
    if (typeof lesson.change === "string") {
      const c = lesson.change.trim();
      if (c && !["false", "0", "no"].includes(c.toLowerCase())) {
        return cancelledWords.includes(c.toLowerCase()) || c === "בוטל" ? "בוטל" : "שינוי";
      }
    }
    return "";
  }

  function eventTypeLabel(item) {
    const raw = item && item.typeLabel;
    if (raw != null && String(raw).trim()) return String(raw).trim();
    const type = String((item && item.type) || "").toUpperCase();
    return TYPE_LABELS[type] || "";
  }

  function examSubject(item) {
    const type = (item.type || "").toUpperCase();
    const fallback = eventTypeLabel(item) || TYPE_LABELS[type] || type || "אירוע";
    const title = String(item.title || item.subject || fallback).trim();
    const parts = title.split(/\s+[—–-]\s+/);
    return (parts[0] || title).trim();
  }

  function pickHomeDay(schedule, today) {
    const tomorrow = addDays(today, 1);
    const days = (schedule && schedule.days || [])
      .map((day) => ({ date: (parseISODate(day.date) || {}).iso, day }))
      .filter((x) => x.date && (x.day.lessons || []).length)
      .sort((a, b) => a.date.localeCompare(b.date));
    const exact = days.find((x) => x.date === tomorrow);
    if (exact) return { date: exact.date, day: exact.day, kind: "tomorrow", isTomorrow: true };
    const next = days.find((x) => x.date > today);
    if (next) return { date: next.date, day: next.day, kind: "upcoming", isTomorrow: false };
    const todayExact = days.find((x) => x.date === today);
    if (todayExact) return { date: todayExact.date, day: todayExact.day, kind: "today", isTomorrow: false };
    return null;
  }

  function upcomingExams(exams, today, limit = 5) {
    return (exams && exams.events || [])
      .filter((item) => EXAM_TYPES.has((item.type || "").toUpperCase()))
      .map((item) => ({ date: (parseISODate(item.eventDate || item.date) || {}).iso, item }))
      .filter((x) => x.date && x.date >= today)
      .sort((a, b) => a.date.localeCompare(b.date))
      .slice(0, limit);
  }

  function lessonRow(lesson, dayIso, over = false) {
    const filled = fillLessonTimes(lesson, Number(lesson && lesson.num) ? Number(lesson.num) - 1 : 0);
    const flag = lessonFlag(filled);
    const cancelled = flag === "בוטל";
    const subject = escapeHtml(filled.subject || "שיעור");
    const flagHtml = flag ? `<span class="flag">${escapeHtml(flag)}</span>` : "";
    const done = isLessonDone(filled, dayIso);
    const checkHtml = done ? `<span class="done-mark" aria-label="השיעור הסתיים">✓</span>` : "";
    const room = formatRoom(filled.room);
    const time = escapeHtml(formatLessonTime(filled));
    return `<div class="row${cancelled ? " cancelled" : ""}${done ? " done" : ""}${over ? " over" : ""}">
      <div class="row-start">
        <div class="row-top"><span class="subject">${subject}</span>${checkHtml}${flagHtml}</div>
        ${room ? `<div class="room">${escapeHtml(room)}</div>` : ""}
      </div>
      ${time ? `<div class="time">${time}</div>` : ""}
    </div>`;
  }

  function examRow(item, dateIso, today, opts = {}) {
    const type = (item.type || "").toUpperCase();
    const subject = escapeHtml(examSubject(item));
    const typeLabel = eventTypeLabel(item);
    const tagHtml = typeLabel ? `<span class="type-tag">${escapeHtml(typeLabel)}</span>` : "";
    const dateLine = dateIso ? formatExamDate(dateIso) : "";
    const [delta, label] = dateIso ? daysUntilLabel(dateIso, today) : [null, ""];
    const urgent = dateIso ? isUrgentCountdown(dateIso, today, type) : false;
    const countHtml = label
      ? `<div class="count${urgent ? " urgent" : ""}">${escapeHtml(label)}</div>`
      : "";
    return `<div class="row">
      <div class="row-start">
        <div class="row-top"><span class="subject">${subject}</span>${tagHtml}</div>
        ${dateLine ? `<div class="room">${escapeHtml(dateLine)}</div>` : ""}
      </div>
      ${countHtml}
    </div>`;
  }

  function renderHome(root, schedule, exams, today) {
    const parts = [];
    const picked = pickHomeDay(schedule, today);
    const tomorrow = addDays(today, 1);
    parts.push(`<section class="section" aria-label="המערכת"><h2 class="section-title"><button type="button" class="section-link" data-target="schedule">המערכת</button></h2>`);
    if (picked) {
      if (picked.isTomorrow) {
        // Tomorrow's timetable is in the data — no extra note needed.
      } else if (picked.kind === "today" || picked.date === today) {
        parts.push(`<p class="info">המערכת למחר עוד לא עודכנה. מוצגת המערכת של ${escapeHtml(formatLongDate(picked.date))}.</p>`);
      } else {
        parts.push(`<p class="info">אין לימודים מחר (${escapeHtml(formatLongDate(tomorrow))}). מוצגת המערכת של ${escapeHtml(formatLongDate(picked.date))}.</p>`);
      }
      const over = isDayOver(picked.day, picked.date);
      if (over) parts.push(DAY_OVER_HTML);
      parts.push((picked.day.lessons || []).map((lesson) => lessonRow(lesson, picked.date, over)).join(""));
    } else if (schedule) {
      parts.push(`<p class="info">המערכת למחר עוד לא עודכנה.</p>`);
    } else {
      parts.push(`<p class="empty">עדיין אין כאן נתונים. ברגע ש-Daft יעביר את המידע, הוא יופיע כאן.</p>`);
    }
    parts.push(`</section>`);

    parts.push(`<section class="section" aria-label="מבחנים"><h2 class="section-title"><button type="button" class="section-link" data-target="exams">מבחנים</button></h2>`);
    const soon = upcomingExams(exams, today);
    if (soon.length) {
      parts.push(soon.map((x) => examRow(x.item, x.date, today)).join(""));
    } else if (exams) {
      parts.push(`<p class="info">אין מבחנים קרובים ברשימה.</p>`);
    } else {
      parts.push(`<p class="empty">עדיין אין כאן נתונים. ברגע ש-Daft יעביר את המידע, הוא יופיע כאן.</p>`);
    }
    parts.push(`</section>`);
    parts.push(`<button type="button" class="more-link" data-target="newsletter">עלון שבועי</button>`);
    parts.push(`<p class="install-hint">כדי לשמור במסך הבית באייפון: פתחו ב-Safari ← לחצו על שיתוף ← הוספה למסך הבית.</p>`);
    root.innerHTML = parts.join("");
    root.querySelectorAll("[data-target]").forEach((btn) => {
      btn.addEventListener("click", () => showScreen(btn.dataset.target));
    });
  }

  function renderSchedule(root, schedule, today) {
    if (!schedule || !(schedule.days || []).length) {
      root.innerHTML = `<p class="empty">עדיין אין כאן נתונים. ברגע ש-Daft יעביר את המידע, הוא יופיע כאן.</p>`;
      return;
    }
    const days = (schedule.days || []).slice().sort((a, b) => (a.date || "").localeCompare(b.date || ""));
    const renderDay = (day) => {
      const iso = (parseISODate(day.date) || {}).iso;
      const isToday = iso === today;
      const lessons = day.lessons || [];
      const over = isToday && isDayOver(day, iso);
      const rows = lessons.length
        ? (over ? DAY_OVER_HTML : "") + lessons.map((lesson) => lessonRow(lesson, iso, over)).join("")
        : `<p class="empty">אין שיעורים ביום זה.</p>`;
      let title;
      if (iso) title = `${isToday ? "היום · " : ""}${formatLongDate(iso)}`;
      else title = day.day || "יום לימודים";
      return `<section class="section"><h2 class="section-title">${escapeHtml(title)}</h2>${rows}</section>`;
    };
    const upcoming = days.filter((day) => {
      const iso = (parseISODate(day.date) || {}).iso;
      return !iso || iso >= today;
    });
    const past = days.filter((day) => {
      const iso = (parseISODate(day.date) || {}).iso;
      return iso && iso < today;
    }).reverse();
    const shabbat = weekdayName(today) === "שבת"
      ? `<p class="info">היום שבת — אין לימודים.</p>`
      : "";
    const pastBlock = past.length
      ? `<section class="section"><h2 class="section-title">ימים שעברו</h2></section>` + past.map(renderDay).join("")
      : "";
    root.innerHTML = `${shabbat}${upcoming.map(renderDay).join("")}${pastBlock}`;
  }

  function renderExams(root, exams, today) {
    if (!exams || !(exams.events || []).length) {
      root.innerHTML = `<p class="empty">עדיין אין כאן נתונים. ברגע ש-Daft יעביר את המידע, הוא יופיע כאן.</p>`;
      return;
    }
    const dated = [];
    const undated = [];
    for (const item of exams.events) {
      const iso = (parseISODate(item.eventDate || item.date) || {}).iso;
      if (iso) dated.push({ date: iso, item });
      else undated.push(item);
    }
    dated.sort((a, b) => a.date.localeCompare(b.date) || String(a.item.type).localeCompare(String(b.item.type)));
    const upcoming = dated.filter((x) => x.date >= today);
    const past = dated.filter((x) => x.date < today).reverse();
    const parts = [];
    if (upcoming.length) {
      parts.push(`<section class="section" aria-label="קרובים"><h2 class="section-title">קרובים</h2>`);
      parts.push(upcoming.map((x) => examRow(x.item, x.date, today, { showType: true })).join(""));
      parts.push(`</section>`);
    } else {
      parts.push(`<p class="info">אין מבחנים או אירועים קרובים ברשימה.</p>`);
    }
    if (undated.length) {
      parts.push(`<section class="section" aria-label="ללא תאריך"><h2 class="section-title">ללא תאריך</h2>`);
      parts.push(undated.map((item) => examRow(item, null, today, { showType: true })).join(""));
      parts.push(`</section>`);
    }
    if (past.length) {
      parts.push(`<section class="section" aria-label="אירועים שעברו"><h2 class="section-title">אירועים שעברו</h2>`);
      parts.push(past.map((x) => examRow(x.item, x.date, today, { showType: true })).join(""));
      parts.push(`</section>`);
    }
    root.innerHTML = parts.join("");
  }

  function renderNewsletter(root, newsletter) {
    if (!newsletter) {
      root.innerHTML = `<p class="empty">עדיין אין כאן נתונים. ברגע ש-Daft יעביר את המידע, הוא יופיע כאן.</p>`;
      return;
    }
    const parts = [];
    const title = newsletter.title || "עלון שבועי";
    parts.push(`<p class="newsletter-title">${escapeHtml(title)}</p>`);
    const iso = (parseISODate(newsletter.date) || {}).iso;
    if (iso) {
      const p = parseISODate(iso);
      parts.push(`<p class="newsletter-date">${p.d} ${HE_MONTHS[p.mo - 1]}</p>`);
    }
    const intro = (newsletter.intro || "").trim();
    if (intro) parts.push(`<p class="intro">${escapeHtml(intro)}</p>`);
    const sections = newsletter.sections || [];
    const visible = sections.filter((section) => section && typeof section === "object");
    if (!intro && !visible.length) {
      parts.push(`<p class="empty">עדיין אין כאן נתונים. ברגע ש-Daft יעביר את המידע, הוא יופיע כאן.</p>`);
    }
    for (const section of visible) {
      const heading = (section.heading || "").trim();
      const body = (section.body || "").trim();
      parts.push(`<section class="section">`);
      if (heading) parts.push(`<h2 class="section-title">${escapeHtml(heading)}</h2>`);
      if (body) parts.push(`<p class="newsletter-body">${escapeHtml(body)}</p>`);
      parts.push(`</section>`);
    }
    root.innerHTML = parts.join("");
  }

  function updateHeader(screen) {
    document.getElementById("greeting").textContent = greetingNow();
    const dateEl = document.getElementById("date-line");
    const className = state.className;
    if (screen === "home" && state.picked) {
      dateEl.textContent = headerDateLine(state.picked.date, state.today, className);
    } else {
      dateEl.textContent = headerDateLine(state.today, state.today, className);
    }
  }

  function showScreen(name) {
    const target = SCREENS.includes(name) ? name : "home";
    document.querySelectorAll(".screen").forEach((el) => {
      el.classList.toggle("active", el.dataset.screen === target);
    });
    const nav = document.getElementById("text-nav");
    nav.classList.toggle("visible", target !== "home");
    nav.querySelectorAll("button").forEach((btn) => {
      btn.setAttribute("aria-selected", btn.dataset.target === target ? "true" : "false");
    });
    updateHeader(target);
    const pushArea = document.getElementById("push-area");
    if (pushArea) pushArea.hidden = target !== "home";
    if (location.hash.replace("#", "") !== target) {
      history.replaceState(null, "", `#${target}`);
    }
    window.scrollTo(0, 0);
  }

  function renderAll() {
    const today = todayIsrael();
    const schedule = state.schedule;
    const exams = state.exams;
    const newsletter = state.newsletter;
    const picked = pickHomeDay(schedule, today);
    const className = formatClass(
      (picked && picked.day && picked.day.class) || (schedule && schedule.class) || CLASS_NAME
    );
    state.today = today;
    state.picked = picked;
    state.className = className;

    const banner = document.getElementById("example-banner");
    banner.hidden = !state.isExample;
    renderHome(document.getElementById("screen-home"), schedule, exams, today);
    renderSchedule(document.getElementById("screen-schedule"), schedule, today);
    renderExams(document.getElementById("screen-exams"), exams, today);
    renderNewsletter(document.getElementById("screen-newsletter"), newsletter);
    const current = location.hash.replace("#", "");
    const screen = SCREENS.includes(current) ? current : "home";
    if (document.getElementById("greeting").textContent) updateHeader(screen);
  }

  function boot(raw) {
    const schedule = normalizeSchedule(raw.schedule);
    const exams = normalizeExams(raw.exams);
    const newsletter = normalizeNewsletter(raw.newsletter);
    const isExample = !!(schedule && schedule.is_example) || !!(exams && exams.is_example) || !!(newsletter && newsletter.is_example);
    state.schedule = schedule;
    state.exams = exams;
    state.newsletter = newsletter;
    state.isExample = isExample;

    renderAll();

    document.getElementById("text-nav").querySelectorAll("button").forEach((btn) => {
      btn.addEventListener("click", () => showScreen(btn.dataset.target));
    });
    window.addEventListener("hashchange", () => showScreen(location.hash.replace("#", "")));
    const initial = location.hash.replace("#", "") || "home";
    showScreen(initial);

    setInterval(renderAll, 60 * 1000);
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") renderAll();
    });
  }

  // ---- Push notifications (iOS 16.4+ home-screen web push) ----
  const VAPID_PUBLIC_KEY = "BABkEtqk9nK9Eb0l-1mkobx2Zp1Oe5BZr_WjYi3v4r6jwxac0JCu0hKQz4F5NMAA-QY_bG8l3Lm7Hwy9ca3BzQo";

  function isIOS() {
    const ua = navigator.userAgent || "";
    return /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  }

  function isStandalone() {
    return window.navigator.standalone === true ||
      (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
  }

  function urlB64ToUint8Array(base64) {
    const padding = "=".repeat((4 - (base64.length % 4)) % 4);
    const b64 = (base64 + padding).replace(/-/g, "+").replace(/_/g, "/");
    const raw = atob(b64);
    return Uint8Array.from(raw, (c) => c.charCodeAt(0));
  }

  function pushNote(text) {
    document.getElementById("push-panel").innerHTML = `<p class="push-note">${escapeHtml(text)}</p>`;
  }

  function showSubscription(sub) {
    const json = JSON.stringify(sub);
    const panel = document.getElementById("push-panel");
    panel.innerHTML = `<p class="push-note">ההתראות מופעלות. שלח את זה לפול:</p>
      <textarea class="push-code" id="push-code" readonly>${escapeHtml(json)}</textarea>
      <button type="button" class="push-copy" id="push-copy">העתק</button>`;
    document.getElementById("push-copy").addEventListener("click", async () => {
      const btn = document.getElementById("push-copy");
      const box = document.getElementById("push-code");
      try {
        await navigator.clipboard.writeText(json);
      } catch {
        box.focus();
        box.select();
        try { document.execCommand("copy"); } catch {}
      }
      btn.textContent = "הועתק ✓";
      setTimeout(() => { btn.textContent = "העתק"; }, 2000);
    });
  }

  async function enablePush() {
    if (isIOS() && !isStandalone()) {
      pushNote("כדי לקבל התראות צריך לפתוח את האפליקציה מהאייקון במסך הבית, לא מ-Safari.");
      return;
    }
    if (!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)) {
      pushNote("המכשיר הזה לא תומך בהתראות. באייפון צריך iOS 16.4 ומעלה, ולפתוח מהאייקון במסך הבית.");
      return;
    }
    try {
      const permission = await Notification.requestPermission();
      if (permission !== "granted") {
        pushNote("ההתראות חסומות. אפשר להפעיל אותן בהגדרות ← התראות ← ט׳3.");
        return;
      }
      const reg = await navigator.serviceWorker.register("sw.js", { scope: "./" });
      await navigator.serviceWorker.ready;
      let sub = await reg.pushManager.getSubscription();
      if (!sub) {
        sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlB64ToUint8Array(VAPID_PUBLIC_KEY),
        });
      }
      showSubscription(sub);
    } catch (err) {
      pushNote("משהו השתבש בהפעלת ההתראות. נסה שוב בעוד רגע.");
      console.error(err);
    }
  }

  function setupPush() {
    const link = document.getElementById("push-link");
    link.addEventListener("click", enablePush);
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js", { scope: "./" }).then(async (reg) => {
        if (!("PushManager" in window) || !("Notification" in window)) return;
        if (Notification.permission !== "granted") return;
        const sub = await reg.pushManager.getSubscription();
        if (sub) link.textContent = "התראות מופעלות · הצג קוד";
      }).catch((err) => console.error(err));
    }
  }

  setupPush();
  loadData().then(boot);
  </script>
</body>
